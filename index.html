<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070b09" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dev Path" />
    <link rel="manifest" href="/3d-room/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/3d-room/icons/icon-192.svg" />
    <link rel="icon" type="image/svg+xml" href="/3d-room/icons/icon-192.svg" />
    <title>Dev Path</title>
    <script type="module" crossorigin src="/3d-room/assets/index-SliMIxhZ.js"></script>
    <link rel="stylesheet" crossorigin href="/3d-room/assets/index-1OIMg5E5.css">
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="loader" class="loader" role="status" aria-live="polite">
        <p class="loader-label">Загрузка</p>
        <div class="loader-track">
          <div class="loader-bar" id="loader-bar"></div>
        </div>
      </div>
      <div id="mode-toggle" class="mode-toggle" role="group" aria-label="Режим">
        <button type="button" class="mode-toggle-btn" data-mode="view" aria-pressed="false">Просмотр</button>
        <button type="button" class="mode-toggle-btn is-active" data-mode="interactive" aria-pressed="true">Интерактив</button>
      </div>
      <div id="overlay" class="overlay">
        <p class="prompt-hint" id="start-hint">Нажмите, чтобы начать</p>
      </div>
      <button type="button" id="chapter-next" class="chapter-next" hidden>Глава 1</button>
      <div id="chapter-modal" class="inspect-modal" hidden>
        <div class="inspect-modal-dialog chapter-dialog" role="dialog" aria-modal="true" aria-labelledby="chapter-modal-text">
          <p id="chapter-modal-text" class="inspect-modal-text chapter-modal-text">Перейти к первой главе?</p>
          <div class="chapter-actions">
            <button type="button" class="chapter-action" id="chapter-stay">Остаться</button>
            <button type="button" class="chapter-action is-primary" id="chapter-go">Перейти</button>
          </div>
        </div>
      </div>
      <div id="chapter-title" class="chapter-title" hidden>
        <p class="chapter-kicker">Глава 1</p>
      </div>
      <div id="inspect-modal" class="inspect-modal" hidden>
        <div class="inspect-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="inspect-modal-text">
          <button type="button" class="inspect-modal-close" id="inspect-modal-close" aria-label="Закрыть">×</button>
          <p id="inspect-modal-text" class="inspect-modal-text"></p>
        </div>
      </div>
      <div id="transition-veil"></div>
    </div>
  </body>
</html>
